name: Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  KCONFIG: >-
    CONFIG_MEDIA_SUPPORT=m CONFIG_DVB_CORE=m CONFIG_DVB_NET=y
    CONFIG_DVB_USB_TBS5930=m CONFIG_DVB_M88RS6060=m
  # -Wno-unused-parameter: older kernel headers (e.g. 6.8) trip -Wextra
  KCFLAGS: -Wall -Wextra -Wno-unused-parameter -Werror

jobs:
  proxmox-9:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v6
      - name: Install Proxmox VE 9 kernel headers
        run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates curl make gcc libelf1t64
          curl -fsSL https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg \
            -o /usr/share/keyrings/proxmox-archive-keyring.gpg
          echo "136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45  /usr/share/keyrings/proxmox-archive-keyring.gpg" | sha256sum -c
          printf '%s\n' 'Types: deb' 'URIs: http://download.proxmox.com/debian/pve' 'Suites: trixie' \
            'Components: pve-no-subscription' 'Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg' \
            > /etc/apt/sources.list.d/proxmox.sources
          apt-get update && apt-get install -y proxmox-default-headers
      - name: Build
        run: make -C "$(ls -d /usr/src/linux-headers-*-pve | sort -V | tail -1)" M=$PWD/drivers/media $KCONFIG KCFLAGS="$KCFLAGS" modules

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The runner's own -azure kernel has no DVB subsystem (no dvb_usbv2_*
      # symbols to link against), so build against Ubuntu's generic kernel.
      - run: sudo apt-get update && sudo apt-get install -y linux-headers-generic
      - name: Build
        run: make -C "$(ls -d /usr/src/linux-headers-*-generic | sort -V | tail -1)" M=$PWD/drivers/media $KCONFIG KCFLAGS="$KCFLAGS" modules
